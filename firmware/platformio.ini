[platformio]
default_envs = esp32s3_safe, esp32s3_evt_a

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Base registry board is N8/no PSRAM. Override memory geometry explicitly for N8R8.
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    -std=gnu++11
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
; Registry ARDUINO_USB_MODE=1 selects the chip USB mode but does not enable CDC.
; Serial remains UART0 RX44/TX43 via the development board USB-UART connector.

[env:esp32s3_safe]
; All LB_PIN_* and screen address default -1. Privacy fail closed. No peripheral pins.

[env:esp32s3_evt_a]
build_flags =
    ${env.build_flags}
    -DLB_PIN_LED_R=4
    -DLB_PIN_LED_G=5
    -DLB_PIN_LED_B=6
    -DLB_PIN_TOUCH=7
    -DLB_PIN_SDA=8
    -DLB_PIN_SCL=9
    -DLB_PIN_PRIVACY=10
    -DLB_SCREEN_ADDRESS=0x3C
; LB_TOUCH_THRESHOLD defaults 0: touch acquisition remains disabled pending real calibration.
